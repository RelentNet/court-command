# docker-compose.yaml
# Complete Court Command stack — all 5 services
#
# Local dev:   `docker compose up db redis ghost`   (run backend + frontend locally)
# Full stack:  `docker compose up`                  (everything in Docker)
# Coolify:     Deploy this file as a Docker Compose resource — one push, all services
#
# Set env vars in Coolify's UI or in a .env file locally.
# See .env.example for all available variables.
#
# NOTE: No host port bindings — Coolify's proxy handles external routing.
# For local dev, override with: docker compose -f docker-compose.yaml -f docker-compose.local.yaml up

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-courtcommand}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-courtcommand}
      POSTGRES_DB: ${POSTGRES_DB:-courtcommand}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-courtcommand}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        # Coolify (this version) does not expose SOURCE_COMMIT at build
        # time; this arg arrives empty and the Dockerfile falls back to
        # commit='unknown'. The build_at timestamp in /api/v1/health
        # remains a reliable deploy fingerprint. If a future Coolify
        # version surfaces the SHA, this arg picks it up automatically.
        COMMIT: ${SOURCE_COMMIT:-${COOLIFY_GIT_COMMIT_SHA:-}}
    expose:
      - "8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://courtcommand:courtcommand@db:5432/courtcommand?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PORT: "8080"
      APP_ENV: ${APP_ENV:-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://courtcommand.app,https://news.courtcommand.app}
      # Logto OIDC (Phase 3+). Without these the API runs but every
      # JWT-protected route 401s -- main.go fail-fast in production
      # mode (APP_ENV=production) refuses to start when any are
      # missing. See docs/LOGTO_SETUP.md for provisioning.
      LOGTO_ENDPOINT: ${LOGTO_ENDPOINT:-}
      LOGTO_API_RESOURCE: ${LOGTO_API_RESOURCE:-}
      LOGTO_MANAGEMENT_API_APP_ID: ${LOGTO_MANAGEMENT_API_APP_ID:-}
      LOGTO_MANAGEMENT_API_APP_SECRET: ${LOGTO_MANAGEMENT_API_APP_SECRET:-}
      LOGTO_MANAGEMENT_API_RESOURCE: ${LOGTO_MANAGEMENT_API_RESOURCE:-}
      LOGTO_WEBHOOK_SIGNING_KEY: ${LOGTO_WEBHOOK_SIGNING_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.courtcommand.app}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        # Logto OIDC -- these are baked into the JS bundle at build
        # time. The frontend throws on init if VITE_LOGTO_ENDPOINT or
        # VITE_LOGTO_APP_ID is missing. Set in Coolify env BEFORE the
        # web service is rebuilt; changes require a build restart.
        VITE_LOGTO_ENDPOINT: ${VITE_LOGTO_ENDPOINT:-}
        VITE_LOGTO_APP_ID: ${VITE_LOGTO_APP_ID:-}
        VITE_LOGTO_API_RESOURCE: ${VITE_LOGTO_API_RESOURCE:-}
        VITE_AUTO_REDIRECT_SINGLE_SPORT: ${VITE_AUTO_REDIRECT_SINGLE_SPORT:-true}
        VITE_WS_URL: ${VITE_WS_URL:-}
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ghost:
    image: ghost:5
    expose:
      - "2368"
    environment:
      url: ${GHOST_URL:-https://news.courtcommand.app}
      database__client: sqlite3
      database__connection__filename: /var/lib/ghost/content/data/ghost.db
      NODE_ENV: production
      # SMTP for Ghost member magic-link emails. Shares the same Resend
      # account / verified domain as the Logto sign-in emails so both
      # authenticate from the same sender reputation. Required for Ghost
      # member sign-up to work; without it Ghost falls back to a console
      # log and members never receive their login link.
      #
      # Ghost uses nodemailer's Direct/SMTP transport. We use generic
      # SMTP (host/port/secure/auth.user/auth.pass) rather than the
      # `service` preset so any SMTP-compatible provider works (Resend,
      # Postmark, AWS SES, SendGrid, etc.) with the same env vars.
      mail__transport: SMTP
      mail__options__host: ${SMTP_HOST:-smtp.resend.com}
      mail__options__port: ${SMTP_PORT:-465}
      mail__options__secureConnection: "true"
      mail__options__auth__user: ${SMTP_USER:-resend}
      mail__options__auth__pass: ${SMTP_PASS:-}
      mail__from: ${EMAIL_FROM_NAME:-Court Command} <${EMAIL_FROM:-noreply@mail.courtcommand.app}>
    volumes:
      - ghost_content:/var/lib/ghost/content
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  ghost_content:

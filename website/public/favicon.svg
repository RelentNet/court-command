<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Dark Background container -->
  <rect width="100" height="100" fill="#05050A" rx="24" />
  
  <defs>
    <!-- Glow filter for the center dot -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradient for the radar slash -->
    <linearGradient id="slash" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B61FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#7B61FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7B61FF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#7B61FF" stroke-width="4" opacity="0.4" />
  
  <!-- Diagonal Slash (Radar sweep) -->
  <line x1="15" y1="85" x2="85" y2="15" stroke="url(#slash)" stroke-width="5" />
  
  <!-- Inner Dot with Glow -->
  <circle cx="50" cy="50" r="12" fill="#7B61FF" filter="url(#glow)" />
</svg>
